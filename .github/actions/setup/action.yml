name: Set up Chat workspace
description: Check out the pinned Mobius revision and install workspace dependencies
inputs:
  mobius-app-id:
    description: ID of the GitHub App that can read moxt-ai/mobius; empty while Mobius is public
    required: false
    default: ""
  mobius-private-key:
    description: Private key of that GitHub App
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Read Mobius revision
      id: mobius
      shell: bash
      run: echo "revision=$(git rev-parse HEAD:third-party/mobius)" >> "$GITHUB_OUTPUT"

    - name: Create a read-only Mobius checkout token
      # Mobius is private: mint a one-hour token that can only read moxt-ai/mobius. Without the App credentials
      # (a public Mobius) the checkout falls back to the caller's read-only GITHUB_TOKEN.
      id: mobius-token
      if: inputs.mobius-app-id != ''
      uses: actions/create-github-app-token@v3.3.0
      with:
        # GitHub accepts the App ID as the JWT issuer.
        client-id: ${{ inputs.mobius-app-id }}
        private-key: ${{ inputs.mobius-private-key }}
        owner: moxt-ai
        repositories: mobius
        permission-contents: read

    - name: Checkout Mobius
      uses: actions/checkout@v7.0.1
      with:
        repository: moxt-ai/mobius
        ref: ${{ steps.mobius.outputs.revision }}
        path: third-party/mobius
        token: ${{ steps.mobius-token.outputs.token || github.token }}
        persist-credentials: false

    - uses: actions/setup-node@v7.0.0
      with:
        node-version-file: .nvmrc

    - name: Enable pnpm
      id: pnpm
      shell: bash
      run: |
        corepack enable
        pnpm --version
        echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store-path }}
        key: pnpm-v11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'third-party/mobius/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-v11-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Mobius dependencies
      shell: bash
      run: pnpm --dir third-party/mobius install --frozen-lockfile

    - name: Build Mobius CLI and ACP harnesses
      shell: bash
      run: pnpm --dir third-party/mobius --filter @moxt-ai/mobius build

    - name: Install Chat dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
