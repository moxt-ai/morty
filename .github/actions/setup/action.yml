name: Set up Chat workspace
description: Check out the pinned Mobius revision and install workspace dependencies
inputs:
  mobius-read-token:
    description: Token used to read the private Mobius repository
    required: true
runs:
  using: composite
  steps:
    - name: Read Mobius revision
      id: mobius
      shell: bash
      run: echo "revision=$(git rev-parse HEAD:third-party/mobius)" >> "$GITHUB_OUTPUT"

    - name: Checkout Mobius
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: moxt-ai/mobius
        ref: ${{ steps.mobius.outputs.revision }}
        path: third-party/mobius
        persist-credentials: false
        token: ${{ inputs.mobius-read-token }}

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - name: Enable pnpm
      id: pnpm
      shell: bash
      run: |
        corepack enable
        pnpm --version
        echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store-path }}
        key: pnpm-v11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'third-party/mobius/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-v11-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Mobius dependencies
      shell: bash
      run: pnpm --dir third-party/mobius install --frozen-lockfile

    - name: Install Chat dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
