name: Prepare business sources
description: Load and build the business revisions selected by this Cloud release
outputs:
  mobius-path:
    description: Mobius repository root
    value: ${{ steps.mobius.outputs.path }}
  slack-path:
    description: Slack repository root
    value: ${{ steps.slack.outputs.path }}
runs:
  using: composite
  steps:
    - name: Validate source pins against submodules
      shell: bash
      run: |
        for path in mobius apps/slack; do
          case "$path" in mobius) repository=mobius ;; apps/slack) repository=mobius-slack ;; esac
          revision="$(git rev-parse "HEAD:$path")"
          grep -Fqx "      uses: moxt-ai/$repository/.github/actions/source@$revision" .github/actions/business-sources/action.yml
        done
    - id: mobius
      uses: moxt-ai/mobius/.github/actions/source@2194bf98708a1bc44617a6361c07648fe428c73e
    - id: slack
      uses: moxt-ai/mobius-slack/.github/actions/source@207d1fd90bcf8742756fac9085d856244dae1349
    - name: Install Mobius dependencies
      shell: bash
      working-directory: ${{ steps.mobius.outputs.path }}
      run: pnpm install --frozen-lockfile
    - name: Install Slack dependencies
      shell: bash
      working-directory: ${{ steps.slack.outputs.path }}
      run: pnpm install --frozen-lockfile
    - name: Build Mobius frontend
      shell: bash
      working-directory: ${{ steps.mobius.outputs.path }}
      run: pnpm --filter @moxt-ai/mobius-web build
    - name: Build Slack frontend
      shell: bash
      working-directory: ${{ steps.slack.outputs.path }}
      run: pnpm --filter @moxt-ai/app-slack-web build
