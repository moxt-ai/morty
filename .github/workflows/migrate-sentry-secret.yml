name: Migrate Sentry deployment secret

# Remove this one-time workflow after both environment secrets are verified.
on:
  workflow_dispatch:

permissions: {}

jobs:
  encrypt:
    if: github.repository == 'moxt-ai/morty' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      # No repository code runs with the existing repository-level credential.
      - name: Install the system sealed-box implementation
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-nacl

      - name: Encrypt for the GitHub environment public keys
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        shell: bash
        run: |
          umask 077
          /usr/bin/python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl import encoding, public

          secret = os.environ['SENTRY_AUTH_TOKEN']
          if not secret:
              raise SystemExit('Missing SENTRY_AUTH_TOKEN')
          # These are GitHub's public keys, fetched from each destination environment.
          destinations = {
              'staging': '0fLa6+69u219stZ8qQAlKnT8/Kf5wtt4M7MT4836MCQ=',
              'production': '2YPKMNa+rOSfWj24HC8IIXmNV4PI7VsgyB6M0UO7Lng=',
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'sentry-environment-ciphertexts'
          output.mkdir(mode=0o700)
          for environment, key in destinations.items():
              public_key = public.PublicKey(key, encoding.Base64Encoder)
              encrypted = public.SealedBox(public_key).encrypt(secret.encode())
              payload = {
                  'key_id': '3380204578043523366',
                  'encrypted_value': base64.b64encode(encrypted).decode(),
              }
              (output / f'{environment}.json').write_text(json.dumps(payload))
          PY

      - name: Save only GitHub-encrypted values for the administrator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentry-environment-ciphertexts
          path: ${{ runner.temp }}/sentry-environment-ciphertexts/*.json
          if-no-files-found: error
          retention-days: 1
