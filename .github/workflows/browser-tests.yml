name: Browser tests (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Each journey starts two Wrangler Workers and a local Runtime, so a shard runs one journey at a time and
        # the suite spreads across shards.
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Install browsers
        run: pnpm --filter @moxt-ai/morty-e2e exec playwright install --with-deps chromium webkit

      - name: Install Codex for the borrowed-session journey
        run: |
          npm install --global --prefix "$RUNNER_TEMP/codex-e2e" @openai/codex@0.154.0
          echo "MOBIUS_TEST_CODEX_PATH=$RUNNER_TEMP/codex-e2e/bin/codex" >> "$GITHUB_ENV"

      - name: Run browser journeys
        run: pnpm test:e2e --shard="$E2E_SHARD"
        env:
          E2E_SHARD: ${{ matrix.shard }}
          # Each journey writes its failure screenshot, page, browser events and trace under its `artifacts`
          # directory here; its `work` directory holds runtime state and is not kept.
          MOBIUS_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/e2e-journeys

      - name: Save failed journey results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: e2e-results-${{ strategy.job-index }}
          path: |
            packages/e2e/test-results/
            ${{ runner.temp }}/e2e-journeys/*/artifacts/
          if-no-files-found: ignore
          retention-days: 14

