name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://mobius.paraflow.biz' || 'https://mobius.paradev.biz' }}
    concurrency:
      group: cloudflare-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        id: pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version
          echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: pnpm-v11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-v11-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      - name: Build selected environment
        run: |
          for setting in VITE_SENTRY_DSN SENTRY_ORG SENTRY_PROJECT SENTRY_AUTH_TOKEN; do
            if [ -z "${!setting}" ]; then
              echo "Missing Sentry deployment setting: $setting" >&2
              exit 1
            fi
          done
          pnpm build
        env:
          CLOUDFLARE_ENV: ${{ inputs.environment }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ inputs.environment }}
          VITE_SENTRY_RELEASE: mobius-cloud@${{ inputs.revision }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Verify remote runtime configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import * as v from 'valibot';
          const environment = v.parse(v.picklist(['staging', 'production']), process.env.DEPLOY_ENVIRONMENT);
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('Missing Cloudflare deployment token');
          const deployment = v.parse(v.object({ configPath: v.string() }),
            JSON.parse(readFileSync('.wrangler/deploy/config.json', 'utf8')),
          );
          const config = v.parse(v.object({
            account_id: v.literal('95af7a3d67be8c49b1619544e3ce53c0'),
            name: v.literal(`mobius-cloud-${environment}`),
            keep_vars: v.literal(true),
            secrets: v.object({
              required: v.pipe(v.array(v.pipe(v.string(), v.regex(/^[A-Z][A-Z0-9_]*$/))), v.minLength(1)),
            }),
          }), JSON.parse(readFileSync(resolve('.wrangler/deploy', deployment.configPath), 'utf8')));
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${config.account_id}/workers/scripts/${config.name}/secrets`,
            { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(30000), redirect: 'error' },
          );
          if (!response.ok) throw new Error(`Worker configuration lookup failed: HTTP ${response.status}`);
          const inventory = v.parse(v.object({
            success: v.literal(true),
            result: v.array(v.object({ name: v.string() })),
          }), await response.json());
          const names = new Set(inventory.result.map(binding => binding.name));
          const missing = config.secrets.required.filter(name => !names.has(name));
          if (missing.length > 0) throw new Error(`Missing Worker runtime settings: ${missing.join(', ')}`);
          console.log(`Verified ${config.name}: ${config.secrets.required.length} runtime setting names; values remain in Cloudflare.`);
          JS

      - name: Apply business migrations to selected environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          pnpm --dir apps/slack db:environment "$GITHUB_WORKSPACE/infra/d1-shards.json" "$DEPLOY_ENVIRONMENT" --remote

      - name: Deploy selected Cloud environment
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
