name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://morty.build' || 'https://morty.paradev.biz' }}
    concurrency:
      group: cloudflare-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}

      - name: Read Mobius revision
        id: mobius
        run: echo "revision=$(git rev-parse HEAD:third-party/mobius)" >> "$GITHUB_OUTPUT"

      - name: Checkout Mobius
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moxt-ai/mobius
          ref: ${{ steps.mobius.outputs.revision }}
          path: third-party/mobius
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        id: pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version
          echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: pnpm-v11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'third-party/mobius/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-v11-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Mobius dependencies
        run: pnpm --dir third-party/mobius install --frozen-lockfile

      # @moxt-ai/mobius resolves its subpath exports from dist, which is gitignored, so a fresh
      # checkout has to build it before anything imports it (the setup bundle does).
      - name: Build Mobius CLI and ACP harnesses
        run: pnpm --dir third-party/mobius --filter @moxt-ai/mobius build

      - name: Install Chat dependencies
        run: pnpm install --frozen-lockfile

      - name: Build selected environment
        run: |
          for setting in VITE_SENTRY_DSN SENTRY_ORG SENTRY_PROJECT SENTRY_AUTH_TOKEN; do
            if [ -z "${!setting}" ]; then
              echo "Missing Sentry deployment setting: $setting" >&2
              exit 1
            fi
          done
          if [ "$CLOUDFLARE_ENV" = production ] && [ -z "$VITE_GA_MEASUREMENT_ID" ]; then
            echo "Missing Google Analytics deployment setting: VITE_GA_MEASUREMENT_ID" >&2
            exit 1
          fi
          pnpm build
        env:
          CLOUDFLARE_ENV: ${{ inputs.environment }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ inputs.environment }}
          VITE_SENTRY_RELEASE: morty@${{ inputs.revision }}
          MORTY_SETUP_REVISION: ${{ inputs.revision }}
          VITE_GA_MEASUREMENT_ID: ${{ inputs.environment == 'production' && vars.GA_MEASUREMENT_ID || '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Publish immutable web assets
        run: pnpm publish:web-assets "${{ inputs.environment }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Validate GitHub runtime configuration
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          MOBIUS_BASE_URL: ${{ vars.MOBIUS_BASE_URL }}
          MOBIUS_APP_ID: ${{ vars.MOBIUS_APP_ID }}
          MOBIUS_APP_SECRET: ${{ secrets.MOBIUS_APP_SECRET }}
        run: node scripts/validate-worker-config.ts

      - name: Publish setup artifact
        run: >-
          pnpm exec wrangler r2 object put "morty-${{ inputs.environment }}-apac-attachments/artifacts/setup.mjs"
          --file packages/setup/dist/setup.mjs --content-type "text/javascript; charset=utf-8"
          --env "${{ inputs.environment }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy selected Cloud environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          MOBIUS_BASE_URL: ${{ vars.MOBIUS_BASE_URL }}
          MOBIUS_APP_ID: ${{ vars.MOBIUS_APP_ID }}
          MOBIUS_APP_SECRET: ${{ secrets.MOBIUS_APP_SECRET }}
        shell: bash
        run: |
          umask 077
          secrets_file="$(mktemp "$RUNNER_TEMP/worker-secrets.XXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          node scripts/validate-worker-config.ts secrets > "$secrets_file"
          worker_vars="$(node scripts/validate-worker-config.ts vars)"
          args=()
          while IFS= read -r -d '' binding; do
            args+=(--var "$binding")
          done < <(printf '%s' "$worker_vars" | jq -j 'to_entries[] | .key + ":" + .value + "\u0000"')
          pnpm exec wrangler deploy --env "$DEPLOY_ENVIRONMENT" --secrets-file "$secrets_file" "${args[@]}"
