name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://mobius-chat.paraflow.biz' || 'https://mobius-chat.paradev.biz' }}
    concurrency:
      group: cloudflare-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.revision }}

      - name: Read Mobius revision
        id: mobius
        run: echo "revision=$(git rev-parse HEAD:third-party/mobius)" >> "$GITHUB_OUTPUT"

      - name: Checkout Mobius
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moxt-ai/mobius
          ref: ${{ steps.mobius.outputs.revision }}
          path: third-party/mobius
          persist-credentials: false
          token: ${{ secrets.MOBIUS_READ_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        id: pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version
          echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: pnpm-v11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'third-party/mobius/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-v11-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Mobius dependencies
        run: pnpm --dir third-party/mobius install --frozen-lockfile

      - name: Install Chat dependencies
        run: pnpm install --frozen-lockfile

      - name: Build selected environment
        run: |
          for setting in VITE_SENTRY_DSN SENTRY_ORG SENTRY_PROJECT SENTRY_AUTH_TOKEN; do
            if [ -z "${!setting}" ]; then
              echo "Missing Sentry deployment setting: $setting" >&2
              exit 1
            fi
          done
          pnpm build
        env:
          CLOUDFLARE_ENV: ${{ inputs.environment }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ inputs.environment }}
          VITE_SENTRY_RELEASE: mobius-cloud@${{ inputs.revision }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Generate regional Worker configurations
        run: >-
          node third-party/mobius/packages/relay-cloudflare-platform/scripts/regional-workers.ts
          --config wrangler.jsonc --built --env "${{ inputs.environment }}"
          --template wrangler.regional.template.json
          --placement regional-placement.json --output ".wrangler/regional/${{ inputs.environment }}"

      - name: Validate GitHub runtime configuration
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          AUTHENTICATION_BASE_URL: ${{ vars.AUTHENTICATION_BASE_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_JWT_KEY: ${{ vars.CLERK_JWT_KEY }}
          MOBIUS_BASE_URL: ${{ vars.MOBIUS_BASE_URL }}
          MOBIUS_APP_ID: ${{ vars.MOBIUS_APP_ID }}
          SLACK_SERVER_BASE_URL: ${{ vars.SLACK_SERVER_BASE_URL }}
          MOBIUS_APP_SECRET: ${{ secrets.MOBIUS_APP_SECRET }}
          SLACK_MOBIUS_AUTH_TOKEN: ${{ secrets.SLACK_MOBIUS_AUTH_TOKEN }}
          SLACK_OAUTH_STATE_SIGNING_KEY: ${{ secrets.SLACK_OAUTH_STATE_SIGNING_KEY }}
          SLACK_TOKEN_ENCRYPTION_KEY: ${{ secrets.SLACK_TOKEN_ENCRYPTION_KEY }}
        run: node scripts/validate-worker-config.ts

      - name: Apply Cloud D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          pnpm exec wrangler d1 migrations apply CHAT_DATABASE_APAC --env "$DEPLOY_ENVIRONMENT" --remote
          pnpm exec wrangler d1 migrations apply CHAT_DATABASE_WNAM --env "$DEPLOY_ENVIRONMENT" --remote

      - name: Publish setup artifact
        run: >-
          pnpm exec wrangler r2 object put "mobius-chat-${{ inputs.environment }}-apac-attachments/artifacts/setup.mjs"
          --file packages/setup/dist/setup.mjs --content-type "text/javascript; charset=utf-8"
          --env "${{ inputs.environment }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy selected Cloud environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          AUTHENTICATION_BASE_URL: ${{ vars.AUTHENTICATION_BASE_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_JWT_KEY: ${{ vars.CLERK_JWT_KEY }}
          MOBIUS_BASE_URL: ${{ vars.MOBIUS_BASE_URL }}
          MOBIUS_APP_ID: ${{ vars.MOBIUS_APP_ID }}
          SLACK_SERVER_BASE_URL: ${{ vars.SLACK_SERVER_BASE_URL }}
          MOBIUS_APP_SECRET: ${{ secrets.MOBIUS_APP_SECRET }}
          SLACK_MOBIUS_AUTH_TOKEN: ${{ secrets.SLACK_MOBIUS_AUTH_TOKEN }}
          SLACK_OAUTH_STATE_SIGNING_KEY: ${{ secrets.SLACK_OAUTH_STATE_SIGNING_KEY }}
          SLACK_TOKEN_ENCRYPTION_KEY: ${{ secrets.SLACK_TOKEN_ENCRYPTION_KEY }}
        shell: bash
        run: |
          umask 077
          secrets_file="$(mktemp "$RUNNER_TEMP/worker-secrets.XXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          node scripts/validate-worker-config.ts secrets > "$secrets_file"
          worker_vars="$(node scripts/validate-worker-config.ts vars)"
          args=()
          while IFS= read -r -d '' binding; do
            args+=(--var "$binding")
          done < <(printf '%s' "$worker_vars" | jq -j 'to_entries[] | .key + ":" + .value + "\u0000"')
          for region in apac wnam; do
            pnpm exec wrangler deploy --config ".wrangler/regional/$DEPLOY_ENVIRONMENT/$region.json" --secrets-file "$secrets_file" "${args[@]}"
          done
          pnpm exec wrangler deploy --env "$DEPLOY_ENVIRONMENT" --secrets-file "$secrets_file" "${args[@]}"
