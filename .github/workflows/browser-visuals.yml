name: Browser visual contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-visuals:
    name: Browser visual contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter @moxt-ai/morty-e2e exec playwright install --with-deps chromium

      - name: Verify agent text and source line alignment
        run: pnpm test:e2e conversation.e2e.test.ts --grep 'grayer'

      - name: Save browser screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: browser-visuals
          path: packages/e2e/test-results/
          if-no-files-found: error
          retention-days: 14

