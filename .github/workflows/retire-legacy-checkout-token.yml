name: Retire legacy checkout token

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect first, then revoke the confirmed legacy token
        type: choice
        options: [inspect, revoke]
        default: inspect
      expected_owner:
        description: Token owner reported by the inspection, required for revocation
        type: string

permissions: {}

jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect or revoke the obsolete checkout credential
        env:
          LEGACY_TOKEN: ${{ secrets.MOBIUS_READ_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_OWNER: ${{ inputs.expected_owner }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';

          const token = process.env.LEGACY_TOKEN;
          if (!token || !/^(ghp_|github_pat_)/.test(token)) {
            throw new Error('Expected the legacy personal access token. No credential was submitted.');
          }
          const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}` };
          const inspect = () => fetch('https://api.github.com/user', {
            headers, redirect: 'error', signal: AbortSignal.timeout(20_000),
          });
          const report = (text) => {
            console.log(text);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${text}\n`);
          };
          const before = await inspect();
          if (before.status === 401) {
            report('GitHub rejects the legacy token (HTTP 401). It is already invalid.');
            process.exit(0);
          }
          if (!before.ok) throw new Error(`Token inspection failed: HTTP ${before.status}`);
          const owner = (await before.json()).login;
          report(`Legacy token owner: ${owner}; OAuth scopes: ${before.headers.get('x-oauth-scopes') || '(fine-grained)'}`);
          if (process.env.OPERATION === 'inspect') process.exit(0);
          if (process.env.OPERATION !== 'revoke' || owner !== process.env.EXPECTED_OWNER) {
            throw new Error('Revocation requires the owner confirmed by the inspection.');
          }
          // This provider endpoint must be called without an Authorization header.
          const response = await fetch('https://api.github.com/credentials/revoke', {
            method: 'POST', redirect: 'error', signal: AbortSignal.timeout(20_000),
            headers: { Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ credentials: [token] }),
          });
          if (response.status !== 202) throw new Error(`Revocation submission failed: HTTP ${response.status}`);
          report('GitHub accepted the single legacy credential for revocation.');
          const deadline = Date.now() + 180_000;
          while (Date.now() < deadline) {
            const result = await inspect();
            if (result.status === 401) {
              report('Verified: GitHub now rejects the legacy token (HTTP 401).');
              process.exit(0);
            }
            if (!result.ok) throw new Error(`Revocation verification failed: HTTP ${result.status}`);
            await setTimeout(10_000);
          }
          throw new Error('Revocation was accepted but invalidation was not observed before the deadline.');
          NODE
