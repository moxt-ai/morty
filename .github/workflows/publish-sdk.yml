name: Publish Mobius Protocol and SDK

on:
  push:
    branches: [main]
    paths:
      - third-party/mobius
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mobius-protocol-and-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: npm
    if: github.repository == 'moxt-ai/mobius-chat' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Mobius revisions
        id: mobius
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-resolve-mobius-revisions.cjs

      - name: Checkout Mobius
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moxt-ai/mobius-moxt
          ref: ${{ steps.mobius.outputs.current }}
          path: third-party/mobius
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.MOBIUS_READ_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: third-party/mobius/.nvmrc
          package-manager-cache: false

      - name: Detect package version changes
        id: versions
        env:
          PREVIOUS_MOBIUS_SHA: ${{ steps.mobius.outputs.previous }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-detect-mobius-package-versions.cjs

      - name: Enable pnpm
        if: steps.versions.outputs.protocol_changed == 'true' || steps.versions.outputs.sdk_changed == 'true'
        run: corepack enable && pnpm --version

      - name: Install release dependencies
        if: steps.versions.outputs.protocol_changed == 'true' || steps.versions.outputs.sdk_changed == 'true'
        run: pnpm --dir third-party/mobius install --frozen-lockfile

      - name: Ensure npm supports OIDC trusted publishing
        if: steps.versions.outputs.protocol_changed == 'true' || steps.versions.outputs.sdk_changed == 'true'
        run: npm install --global npm@11.5.1 && npm --version

      - name: Check npm publication state
        id: registry
        if: steps.versions.outputs.protocol_changed == 'true' || steps.versions.outputs.sdk_changed == 'true'
        env:
          PROTOCOL_CHANGED: ${{ steps.versions.outputs.protocol_changed }}
          SDK_CHANGED: ${{ steps.versions.outputs.sdk_changed }}
        run: node scripts/ci-check-mobius-publication-state.cjs

      - name: Require the SDK Protocol dependency
        if: steps.versions.outputs.sdk_changed == 'true' && steps.versions.outputs.protocol_changed != 'true' && steps.registry.outputs.protocol_exists != 'true'
        env:
          PROTOCOL_EXISTS: ${{ steps.registry.outputs.protocol_exists }}
        run: node scripts/ci-require-mobius-protocol.cjs

      - name: Pack release artifacts
        if: steps.versions.outputs.protocol_changed == 'true' || steps.versions.outputs.sdk_changed == 'true'
        env:
          PROTOCOL_CHANGED: ${{ steps.versions.outputs.protocol_changed }}
          PROTOCOL_EXISTS: ${{ steps.registry.outputs.protocol_exists }}
          SDK_CHANGED: ${{ steps.versions.outputs.sdk_changed }}
          SDK_EXISTS: ${{ steps.registry.outputs.sdk_exists }}
        run: node scripts/ci-pack-mobius-releases.cjs

      - name: Publish Protocol
        if: steps.versions.outputs.protocol_changed == 'true' && steps.registry.outputs.protocol_exists != 'true'
        run: node scripts/ci-publish-mobius-release.cjs protocol

      - name: Wait for Protocol registry availability
        if: steps.versions.outputs.sdk_changed == 'true' && steps.versions.outputs.protocol_changed == 'true' && steps.registry.outputs.protocol_exists != 'true'
        run: node scripts/ci-wait-for-mobius-protocol.cjs

      - name: Publish SDK
        if: steps.versions.outputs.sdk_changed == 'true' && steps.registry.outputs.sdk_exists != 'true'
        run: node scripts/ci-publish-mobius-release.cjs sdk
