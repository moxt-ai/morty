name: Morty Cloud

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Build, restore a completed release, or provision service authority
        type: choice
        default: build
        options: [build, restore, provision-service]
      artifact_run_id:
        description: Successful automatic Morty CLI or accepted legacy Morty Cloud run
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation != 'build' && 'morty-production-release' || format('morty-cloud-build-{0}', github.ref) }}
  queue: max
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml

  release:
    needs: security
    if: github.repository == 'moxt-ai/mobius-morty'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (inputs.operation == 'restore' || inputs.operation == 'provision-service')) && 'morty-production' || 'build-only' }}
    env:
      TARGET_ENVIRONMENT: production
      OPERATION: ${{ inputs.operation || 'build' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: corepack enable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: morty-cloud-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Morty dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify account-owned deployment authority
        if: >-
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
          (env.OPERATION == 'restore' || env.OPERATION == 'provision-service')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 deployment/verify-account-token.py
      - name: Prepare the environment-owned Morty service credential
        if: github.ref == 'refs/heads/main' && env.OPERATION == 'provision-service'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MORTY_SERVICE_SECRET: ${{ secrets.MORTY_SERVICE_SECRET }}
        run: node deployment/provision-service.ts "$TARGET_ENVIRONMENT" prepare
      - name: Build the Runtime and Agent harnesses
        if: env.OPERATION != 'restore' && env.OPERATION != 'provision-service'
        run: pnpm build:cli
      - name: Check Morty formatting and architecture
        if: env.OPERATION != 'restore' && env.OPERATION != 'provision-service'
        run: pnpm lint
      - name: Check Morty types
        if: env.OPERATION != 'restore' && env.OPERATION != 'provision-service'
        run: pnpm typecheck
      - name: Build the portable release
        if: env.OPERATION != 'restore' && env.OPERATION != 'provision-service'
        run: python3 deployment/build.py "$TARGET_ENVIRONMENT"
      - name: Verify the production release configuration without deploying
        if: env.OPERATION != 'restore' && env.OPERATION != 'provision-service'
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: python3 deployment/deploy.py "$TARGET_ENVIRONMENT" --release ".deployment-output/$TARGET_ENVIRONMENT" --verify-release-only
      - name: Archive compiled code, assets, migrations and checksums
        if: env.OPERATION != 'restore' && env.OPERATION != 'provision-service'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TARGET_ENVIRONMENT }}
          path: .deployment-output/${{ env.TARGET_ENVIRONMENT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Verify the requested archive run
        if: env.OPERATION == 'restore'
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_RUN_ID: ${{ inputs.artifact_run_id }}
        run: node scripts/verify-recovery.mjs
      - name: Download the exact archived release
        if: env.OPERATION == 'restore' && steps.archive.outputs.legacy != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-release
          path: .release
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Download the accepted legacy cloud archive
        if: env.OPERATION == 'restore' && steps.archive.outputs.legacy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-production
          path: .release/cloud
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Download its successfully published CLI archive
        if: env.OPERATION == 'restore' && steps.archive.outputs.legacy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-cli
          path: .release
          run-id: ${{ steps.archive.outputs.cli_run }}
          github-token: ${{ github.token }}
      - name: Publish to the independent account and verify health
        if: >-
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
          env.OPERATION == 'restore'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MORTY_SERVICE_SECRET: ${{ secrets.MORTY_SERVICE_SECRET }}
          EXPECTED_REVISION: ${{ steps.archive.outputs.revision }}
          MORTY_ALLOW_RESTORE: 'true'
        run: python3 deployment/deploy.py "$TARGET_ENVIRONMENT" --release .release/cloud --cli-release .release/release.json
      - name: Archive deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-evidence-${{ env.TARGET_ENVIRONMENT }}
          path: |
            deployment-evidence.json
            account-token-evidence.json
          if-no-files-found: ignore
          retention-days: 90
