name: Morty Cloud

# Manual production operations. The release pipeline builds and verifies cloud
# artifacts; this workflow never builds a competing one.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Restore a completed release or provision service authority
        type: choice
        required: true
        options: [restore, provision-service]
      artifact_run_id:
        description: Successful automatic Morty CLI or accepted legacy Morty Cloud run
        type: string
        required: false

permissions:
  contents: read
  actions: read

# Shared with the release chain: production changes run one at a time.
concurrency:
  group: morty-production-release
  queue: max
  cancel-in-progress: false

jobs:
  operation:
    if: github.repository_id == '1446677406' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: morty-production
    env:
      TARGET_ENVIRONMENT: production
      OPERATION: ${{ inputs.operation }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install Morty dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify account-owned deployment authority
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 deployment/verify-account-token.py
      - name: Prepare the environment-owned Morty service credential
        if: env.OPERATION == 'provision-service'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MORTY_SERVICE_SECRET: ${{ secrets.MORTY_SERVICE_SECRET }}
        run: node deployment/provision-service.ts "$TARGET_ENVIRONMENT" prepare
      - name: Verify the requested archive run
        if: env.OPERATION == 'restore'
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_RUN_ID: ${{ inputs.artifact_run_id }}
        run: node scripts/verify-recovery.mjs
      - name: Download the exact archived release
        if: env.OPERATION == 'restore' && steps.archive.outputs.legacy != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-release
          path: .release
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Download the accepted legacy cloud archive
        if: env.OPERATION == 'restore' && steps.archive.outputs.legacy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-production
          path: .release/cloud
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Download its successfully published CLI archive
        if: env.OPERATION == 'restore' && steps.archive.outputs.legacy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-cli
          path: .release
          run-id: ${{ steps.archive.outputs.cli_run }}
          github-token: ${{ github.token }}
      - name: Restore source maps for the exact archived browser release
        if: env.OPERATION == 'restore'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPECTED_REVISION: ${{ steps.archive.outputs.revision }}
        run: |
          python3 deployment/deploy.py "$TARGET_ENVIRONMENT" --release .release/cloud --cli-release .release/release.json --verify-release-only
          node scripts/upload-sentry-sourcemaps.mjs .release/cloud
      - name: Publish to the independent account and verify health
        if: env.OPERATION == 'restore'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MORTY_SERVICE_SECRET: ${{ secrets.MORTY_SERVICE_SECRET }}
          MORTY_SESSION_SIGNING_SECRET: ${{ secrets.MORTY_SESSION_SIGNING_SECRET }}
          EXPECTED_REVISION: ${{ steps.archive.outputs.revision }}
          MORTY_ALLOW_RESTORE: 'true'
        run: |
          python3 deployment/deploy.py "$TARGET_ENVIRONMENT" --release .release/cloud --cli-release .release/release.json
          python3 deployment/deploy.py "$TARGET_ENVIRONMENT" --release .release/cloud --cli-release .release/release.json --activate-setup
      - name: Archive deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-evidence-${{ env.TARGET_ENVIRONMENT }}
          path: |
            deployment-evidence.json
            account-token-evidence.json
            session-access-evidence.json
            setup-evidence.json
          if-no-files-found: ignore
          retention-days: 90
