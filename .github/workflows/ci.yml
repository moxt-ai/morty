name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      verify_macos_setup:
        description: Run macOS setup compatibility instead of deployment
        required: false
        type: boolean
        default: false
      environment:
        description: Environment to deploy from main
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-setup:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_macos_setup
    uses: ./.github/workflows/setup-compatibility.yml

  validate-worker-config:
    name: Validate Worker config (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }})
    if: >-
      !inputs.verify_macos_setup &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.ENABLE_AUTOMATIC_MORTY_STAGING_DEPLOY == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate GitHub runtime configuration
        run: node scripts/validate-worker-config.ts
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          MOBIUS_BASE_URL: ${{ vars.MOBIUS_BASE_URL }}
          MOBIUS_APP_ID: ${{ vars.MOBIUS_APP_ID }}
          MOBIUS_APP_SECRET: ${{ secrets.MOBIUS_APP_SECRET }}

  static:
    name: static
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Validate Worker config with public fixtures
        run: node scripts/validate-worker-config.ts
        env:
          APP_ORIGIN: https://chat.example.invalid
          MOBIUS_BASE_URL: https://platform.example.invalid
          MOBIUS_APP_ID: ci-app
          MOBIUS_APP_SECRET: ci-placeholder

      - run: pnpm check:static

  tests:
    name: Tests (${{ matrix.suite }} ${{ matrix.shard }})
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners for this repository have 2 vCPUs. Each web test file starts its own Chat and Platform
        # workerd isolates and a Runtime daemon, so a shard runs one file at a time and the suite spreads across shards.
        include:
          - suite: web
            shard: 1/8
            report: web-1
          - suite: web
            shard: 2/8
            report: web-2
          - suite: web
            shard: 3/8
            report: web-3
          - suite: web
            shard: 4/8
            report: web-4
          - suite: web
            shard: 5/8
            report: web-5
          - suite: web
            shard: 6/8
            report: web-6
          - suite: web
            shard: 7/8
            report: web-7
          - suite: web
            shard: 8/8
            report: web-8
          - suite: worker
            shard: 1/1
            report: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run integration tests with coverage
        working-directory: packages/${{ matrix.suite }}
        run: pnpm exec vitest run --coverage --shard="$TEST_SHARD" --coverage.reportsDirectory="../../coverage/$COVERAGE_REPORT" $TEST_WORKERS
        env:
          TEST_SHARD: ${{ matrix.shard }}
          COVERAGE_REPORT: ${{ matrix.report }}
          TEST_WORKERS: ${{ matrix.suite == 'web' && '--maxWorkers=1' || '' }}

      - name: Verify web asset publishing
        if: matrix.suite == 'worker'
        run: pnpm test:web-assets

      - name: Save suite coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-input-${{ matrix.report }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Merge coverage
    needs: [tests]
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install coverage report dependencies
        run: |
          corepack enable
          pnpm --dir scripts/coverage-report install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-input-*
          path: coverage/
          merge-multiple: true

      # A root pnpm script can auto-install the whole workspace before it runs.
      - run: node scripts/coverage.mjs --merge-only --web-shards=8

      - name: Save combined coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  native-setup:
    name: Setup preflight (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify native executable and private state boundaries
        run: >-
          pnpm --filter @moxt-ai/morty-worker exec vitest run
          tests/setup-filesystem.integration.test.ts
          -t "Mobius executable|local workspace and a private state directory|junction replaces"
          --maxWorkers=1

  check:
    name: check
    needs: [static, tests, coverage, native-setup]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require static checks and tests to pass
        run: |
          test "$STATIC_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$NATIVE_SETUP_RESULT" = success
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          NATIVE_SETUP_RESULT: ${{ needs.native-setup.result }}

  deploy:
    needs: [validate-worker-config]
    if: >-
      !inputs.verify_macos_setup &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.ENABLE_AUTOMATIC_MORTY_STAGING_DEPLOY == 'true'))
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      revision: ${{ github.sha }}
