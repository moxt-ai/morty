name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      verify_macos_setup:
        description: Run macOS setup compatibility instead of deployment
        required: false
        type: boolean
        default: false
      environment:
        description: Environment to deploy from main
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-setup:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_macos_setup
    uses: ./.github/workflows/setup-compatibility.yml
    secrets: inherit

  validate-worker-config:
    name: Validate Worker config (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }})
    if: >-
      !inputs.verify_macos_setup &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate GitHub runtime configuration
        run: node scripts/validate-worker-config.ts
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          AUTHENTICATION_BASE_URL: ${{ vars.AUTHENTICATION_BASE_URL }}
          MOBIUS_BASE_URL: ${{ vars.MOBIUS_BASE_URL }}
          MOBIUS_APP_ID: ${{ vars.MOBIUS_APP_ID }}
          MOBIUS_APP_SECRET: ${{ secrets.MOBIUS_APP_SECRET }}

  static:
    name: static
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mobius-read-token: ${{ secrets.MOBIUS_READ_TOKEN }}

      - run: pnpm check:static

  tests:
    name: Tests (${{ matrix.suite }} ${{ matrix.shard }})
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: web
            shard: 1/2
            report: web-1
          - suite: web
            shard: 2/2
            report: web-2
          - suite: worker
            shard: 1/1
            report: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mobius-read-token: ${{ secrets.MOBIUS_READ_TOKEN }}

      - name: Run integration tests with coverage
        working-directory: packages/${{ matrix.suite }}
        run: pnpm exec vitest run --coverage --shard="$TEST_SHARD" --coverage.reportsDirectory="../../coverage/$COVERAGE_REPORT"
        env:
          TEST_SHARD: ${{ matrix.shard }}
          COVERAGE_REPORT: ${{ matrix.report }}

      - name: Verify web asset publishing
        if: matrix.suite == 'worker'
        run: pnpm test:web-assets

      - name: Save suite coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.report }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Merge coverage
    needs: [tests]
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mobius-read-token: ${{ secrets.MOBIUS_READ_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage/
          merge-multiple: true

      - run: pnpm test:coverage:merge --web-shards=2

      - name: Save combined coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  check:
    name: check
    needs: [static, tests, coverage]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require static checks and tests to pass
        run: |
          test "$STATIC_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$COVERAGE_RESULT" = success
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}

  deploy:
    needs: [validate-worker-config]
    if: >-
      !inputs.verify_macos_setup &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.ENABLE_AUTOMATIC_MORTY_STAGING_DEPLOY == 'true'))
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      revision: ${{ github.sha }}
