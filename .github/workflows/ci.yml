name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy from main
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-worker-config:
    name: Validate Worker config (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate GitHub runtime configuration
        run: node scripts/validate-worker-config.ts
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          AUTHENTICATION_BASE_URL: ${{ vars.AUTHENTICATION_BASE_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_JWT_KEY: ${{ vars.CLERK_JWT_KEY }}
          MOBIUS_BASE_URL: ${{ vars.MOBIUS_BASE_URL }}
          MOBIUS_APP_ID: ${{ vars.MOBIUS_APP_ID }}
          SLACK_SERVER_BASE_URL: ${{ vars.SLACK_SERVER_BASE_URL }}
          MOBIUS_APP_SECRET: ${{ secrets.MOBIUS_APP_SECRET }}
          SLACK_MOBIUS_AUTH_TOKEN: ${{ secrets.SLACK_MOBIUS_AUTH_TOKEN }}
          SLACK_OAUTH_STATE_SIGNING_KEY: ${{ secrets.SLACK_OAUTH_STATE_SIGNING_KEY }}
          SLACK_TOKEN_ENCRYPTION_KEY: ${{ secrets.SLACK_TOKEN_ENCRYPTION_KEY }}

  static:
    name: static
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mobius-read-token: ${{ secrets.MOBIUS_READ_TOKEN }}

      - run: pnpm check:static

  tests:
    name: tests
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mobius-read-token: ${{ secrets.MOBIUS_READ_TOKEN }}

      - run: pnpm test:coverage

      - name: Save coverage report
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  check:
    name: check
    needs: [static, tests]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require static checks and tests to pass
        run: |
          test "$STATIC_RESULT" = success
          test "$TESTS_RESULT" = success
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TESTS_RESULT: ${{ needs.tests.result }}

  deploy:
    needs: [validate-worker-config]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      revision: ${{ github.sha }}
