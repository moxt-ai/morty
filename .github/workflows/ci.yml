name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy from main
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        id: pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version
          echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: pnpm-v11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.github/actions/business-sources/action.yml') }}
          restore-keys: |
            pnpm-v11-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare business sources
        id: businesses
        uses: ./.github/actions/business-sources

      - run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "version=" + require("playwright/package.json").version + "\n")'

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Ensure browser and system dependencies
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - run: pnpm check

      - name: Validate business migrations on every local shard
        env:
          MOBIUS_PATH: ${{ steps.businesses.outputs.mobius-path }}
          SLACK_PATH: ${{ steps.businesses.outputs.slack-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/shared-d1" "$MOBIUS_PATH/packages/relay-cloudflare/.wrangler" "$SLACK_PATH/packages/worker/.wrangler"
          ln -s "$RUNNER_TEMP/shared-d1" "$MOBIUS_PATH/packages/relay-cloudflare/.wrangler/shards"
          ln -s "$RUNNER_TEMP/shared-d1" "$SLACK_PATH/packages/worker/.wrangler/shards"
          for environment in staging production; do
            pnpm --dir "$MOBIUS_PATH" db:environment "$GITHUB_WORKSPACE/infra/d1-shards.json" "$environment" --local
            pnpm --dir "$SLACK_PATH" db:environment "$GITHUB_WORKSPACE/infra/d1-shards.json" "$environment" --local
          done

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      revision: ${{ github.sha }}
