name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy from main
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-worker-config:
    name: Validate Worker config (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate GitHub runtime configuration
        run: node scripts/validate-worker-config.ts
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          AUTHENTICATION_BASE_URL: ${{ vars.AUTHENTICATION_BASE_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_JWT_KEY: ${{ vars.CLERK_JWT_KEY }}
          MOBIUS_BASE_URL: ${{ vars.MOBIUS_BASE_URL }}
          MOBIUS_APP_ID: ${{ vars.MOBIUS_APP_ID }}
          SLACK_SERVER_BASE_URL: ${{ vars.SLACK_SERVER_BASE_URL }}
          MOBIUS_APP_SECRET: ${{ secrets.MOBIUS_APP_SECRET }}
          SLACK_MOBIUS_AUTH_TOKEN: ${{ secrets.SLACK_MOBIUS_AUTH_TOKEN }}
          SLACK_OAUTH_STATE_SIGNING_KEY: ${{ secrets.SLACK_OAUTH_STATE_SIGNING_KEY }}
          SLACK_TOKEN_ENCRYPTION_KEY: ${{ secrets.SLACK_TOKEN_ENCRYPTION_KEY }}

  checks:
    name: ${{ matrix.check }}
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, build, lint, "test:web", "test:worker", knip, "test:e2e:opencode", migrations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mobius-read-token: ${{ secrets.MOBIUS_READ_TOKEN }}

      - name: Install latest OpenCode
        if: matrix.check == 'test:e2e:opencode'
        run: |
          npm install --global opencode-ai@latest
          opencode --version

      - name: Run ${{ matrix.check }}
        if: matrix.check != 'migrations'
        run: pnpm "$CHECK_SCRIPT"
        env:
          CHECK_SCRIPT: ${{ matrix.check }}
          MOBIUS_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/mobius-chat-setup-e2e
          MOBIUS_E2E_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          MOBIUS_E2E_TIMEOUT_MS: "1200000"
          OPENCODE_DISABLE_AUTOUPDATE: "1"

      - name: Upload browser journey failure diagnostics
        if: failure() && matrix.check == 'test:e2e:opencode'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/mobius-chat-setup-e2e/**/artifacts
          if-no-files-found: ignore

      - name: Save suite coverage for merging
        if: ${{ !cancelled() && (matrix.check == 'test:web' || matrix.check == 'test:worker') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-suite-${{ matrix.check == 'test:web' && 'web' || 'worker' }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Validate Cloud D1 migrations
        if: matrix.check == 'migrations'
        run: |
          pnpm exec wrangler d1 migrations apply CHAT_DATABASE_APAC --local
          pnpm exec wrangler d1 migrations apply CHAT_DATABASE_WNAM --local

  check:
    name: check
    needs: [checks]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mobius-read-token: ${{ secrets.MOBIUS_READ_TOKEN }}

      - name: Download suite coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-suite-*
          merge-multiple: true
          path: coverage/

      - name: Merge web and Worker coverage
        run: pnpm test:coverage:merge

      - name: Save combined coverage report
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Require every parallel check to pass
        if: always()
        run: test "$CHECKS_RESULT" = success
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}

  deploy:
    needs: [validate-worker-config]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      revision: ${{ github.sha }}
