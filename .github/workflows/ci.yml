name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy from main
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        id: pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version
          echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: pnpm-v11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.github/actions/business-sources/action.yml') }}
          restore-keys: |
            pnpm-v11-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare business sources
        id: businesses
        uses: ./.github/actions/business-sources

      - run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "version=" + require("playwright/package.json").version + "\n")'

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Ensure browser and system dependencies
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - run: pnpm check

      - name: Validate business migrations on every local shard
        env:
          MOBIUS_PATH: ${{ steps.businesses.outputs.mobius-path }}
          SLACK_PATH: ${{ steps.businesses.outputs.slack-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/shared-d1" "$MOBIUS_PATH/packages/relay-cloudflare/.wrangler" "$SLACK_PATH/packages/worker/.wrangler"
          ln -s "$RUNNER_TEMP/shared-d1" "$MOBIUS_PATH/packages/relay-cloudflare/.wrangler/shards"
          ln -s "$RUNNER_TEMP/shared-d1" "$SLACK_PATH/packages/worker/.wrangler/shards"
          for environment in staging production; do
            pnpm --dir "$MOBIUS_PATH" db:environment "$GITHUB_WORKSPACE/infra/d1-shards.json" "$environment" --local
            pnpm --dir "$SLACK_PATH" db:environment "$GITHUB_WORKSPACE/infra/d1-shards.json" "$environment" --local
          done

  deploy:
    name: deploy
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      url: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && 'https://mobius.paraflow.biz' || 'https://mobius.paradev.biz' }}
    concurrency:
      group: cloudflare-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        id: pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version
          echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: pnpm-v11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.github/actions/business-sources/action.yml') }}
          restore-keys: |
            pnpm-v11-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare business sources
        id: businesses
        uses: ./.github/actions/business-sources

      - run: pnpm install --frozen-lockfile

      - name: Build selected environment
        run: pnpm build
        env:
          CLOUDFLARE_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}

      - name: Verify remote runtime configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { z } from 'zod';
          const environment = z.enum(['staging', 'production']).parse(process.env.DEPLOY_ENVIRONMENT);
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('Missing Cloudflare deployment token');
          const deployment = z.object({ configPath: z.string() }).parse(
            JSON.parse(readFileSync('.wrangler/deploy/config.json', 'utf8')),
          );
          const config = z.object({
            account_id: z.literal('95af7a3d67be8c49b1619544e3ce53c0'),
            name: z.literal(`mobius-cloud-${environment}`),
            keep_vars: z.literal(true),
            secrets: z.object({ required: z.array(z.string().regex(/^[A-Z][A-Z0-9_]*$/)).min(1) }),
          }).parse(JSON.parse(readFileSync(resolve('.wrangler/deploy', deployment.configPath), 'utf8')));
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${config.account_id}/workers/scripts/${config.name}/secrets`,
            { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(30000), redirect: 'error' },
          );
          if (!response.ok) throw new Error(`Worker configuration lookup failed: HTTP ${response.status}`);
          const inventory = z.object({
            success: z.literal(true),
            result: z.array(z.object({ name: z.string() })),
          }).parse(await response.json());
          const names = new Set(inventory.result.map(binding => binding.name));
          const missing = config.secrets.required.filter(name => !names.has(name));
          if (missing.length > 0) throw new Error(`Missing Worker runtime settings: ${missing.join(', ')}`);
          console.log(`Verified ${config.name}: ${config.secrets.required.length} runtime setting names; values remain in Cloudflare.`);
          JS

      - name: Apply business migrations to selected environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
          MOBIUS_PATH: ${{ steps.businesses.outputs.mobius-path }}
          SLACK_PATH: ${{ steps.businesses.outputs.slack-path }}
        run: |
          pnpm --dir "$MOBIUS_PATH" db:environment "$GITHUB_WORKSPACE/infra/d1-shards.json" "$DEPLOY_ENVIRONMENT" --remote
          pnpm --dir "$SLACK_PATH" db:environment "$GITHUB_WORKSPACE/infra/d1-shards.json" "$DEPLOY_ENVIRONMENT" --remote

      - name: Deploy selected Cloud environment
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
