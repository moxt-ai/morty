name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy from main
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        id: pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version
          echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: pnpm-v11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.github/actions/business-sources/action.yml') }}
          restore-keys: |
            pnpm-v11-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "version=" + require("playwright/package.json").version + "\n")'

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Ensure browser and system dependencies
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - run: pnpm check

      - name: Prepare business sources
        id: businesses
        uses: ./.github/actions/business-sources

      - name: Validate business migrations on every local shard
        env:
          MOBIUS_PATH: ${{ steps.businesses.outputs.mobius-path }}
          SLACK_PATH: ${{ steps.businesses.outputs.slack-path }}
        run: |
          for environment in staging production; do
            pnpm --dir "$MOBIUS_PATH" db:environment "$GITHUB_WORKSPACE/infra/d1-shards.json" "$environment" --local
            pnpm --dir "$SLACK_PATH" db:environment "$GITHUB_WORKSPACE/infra/d1-shards.json" "$environment" --local
          done

  deploy:
    name: deploy
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      url: ${{ vars.APP_ORIGIN }}
    concurrency:
      group: cloudflare-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        id: pnpm
        shell: bash
        run: |
          corepack enable
          pnpm --version
          echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: pnpm-v11-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.github/actions/business-sources/action.yml') }}
          restore-keys: |
            pnpm-v11-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      - name: Validate deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { z } from 'zod';
          const config = z.object({
            CLOUDFLARE_API_TOKEN: z.string().min(1),
            CLOUDFLARE_ACCOUNT_ID: z.string().regex(/^[a-f0-9]{32}$/),
            APP_ORIGIN: z.url().refine(value => {
              const url = new URL(value);
              return url.protocol === 'https:' && url.origin === value;
            }),
            CLERK_PUBLISHABLE_KEY: z.string().regex(/^pk_(test|live)_/),
            CLERK_JWT_KEY: z.string().startsWith('-----BEGIN PUBLIC KEY-----'),
            DEPLOY_ENVIRONMENT: z.enum(['staging', 'production']),
            RUNNER_TEMP: z.string().min(1),
          }).safeParse(process.env);
          if (!config.success) {
            console.error('Missing or invalid deployment settings:',
              config.error.issues.map(issue => issue.path.join('.')).join(', '));
            process.exit(1);
          }
          const settings = config.data;
          const prefix = settings.DEPLOY_ENVIRONMENT === 'production' ? 'pk_live_' : 'pk_test_';
          if (!settings.CLERK_PUBLISHABLE_KEY.startsWith(prefix)) {
            console.error('Clerk instance does not match deployment environment.');
            process.exit(1);
          }
          writeFileSync(join(settings.RUNNER_TEMP, 'worker-secrets.json'), JSON.stringify({
            APP_ORIGIN: settings.APP_ORIGIN,
            CLERK_PUBLISHABLE_KEY: settings.CLERK_PUBLISHABLE_KEY,
            CLERK_JWT_KEY: settings.CLERK_JWT_KEY,
          }), { mode: 0o600 });
          JS

      - name: Build selected environment
        run: pnpm build
        env:
          CLOUDFLARE_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}

      - name: Prepare business sources
        id: businesses
        uses: ./.github/actions/business-sources

      - name: Apply business migrations to selected environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
          MOBIUS_PATH: ${{ steps.businesses.outputs.mobius-path }}
          SLACK_PATH: ${{ steps.businesses.outputs.slack-path }}
        run: |
          pnpm --dir "$MOBIUS_PATH" db:environment "$GITHUB_WORKSPACE/infra/d1-shards.json" "$DEPLOY_ENVIRONMENT" --remote
          pnpm --dir "$SLACK_PATH" db:environment "$GITHUB_WORKSPACE/infra/d1-shards.json" "$DEPLOY_ENVIRONMENT" --remote

      - name: Migrate active Slack database
        if: github.event_name != 'workflow_dispatch' || inputs.environment == 'staging'
        working-directory: ${{ steps.businesses.outputs.slack-path }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @moxt-ai/app-slack-worker exec wrangler d1 migrations apply DATABASE --remote --env staging

      - name: Migrate active Mobius database
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
        working-directory: ${{ steps.businesses.outputs.mobius-path }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @moxt-ai/mobius-relay-cloudflare exec wrangler d1 migrations apply DIRECTORY_DATABASE --remote --config wrangler.r2.jsonc

      - name: Deploy Slack staging
        if: github.event_name != 'workflow_dispatch' || inputs.environment == 'staging'
        working-directory: ${{ steps.businesses.outputs.slack-path }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @moxt-ai/app-slack-worker exec wrangler deploy --env staging

      - name: Deploy Mobius production
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
        working-directory: ${{ steps.businesses.outputs.mobius-path }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @moxt-ai/mobius-relay-cloudflare exec wrangler deploy \
            --config wrangler.r2.jsonc \
            --domain mobius-relay.paraflow.biz \
            --strict \
            --message "Cloud ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

      - name: Verify business health
        env:
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
        run: |
          case "$DEPLOY_ENVIRONMENT" in
            staging) url=https://mobius-slack-staging.paraflow.workers.dev/health; service=app-slack ;;
            production) url=https://mobius-relay.paraflow.biz/health; service=mobius-relay ;;
          esac
          curl --fail --show-error --silent --connect-timeout 5 --max-time 15 \
            --retry 5 --retry-all-errors "$url" | jq -e --arg service "$service" '.status == "ok" and .service == $service'

      - name: Deploy selected Cloud environment
        run: pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove deployment settings
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
