name: Bootstrap Worker runtime secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing Worker to populate with missing runtime settings
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    concurrency:
      group: cloudflare-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Copy only missing runtime settings to the existing Worker
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          AUTHENTICATION_BASE_URL: ${{ vars.AUTHENTICATION_BASE_URL }}
          CLERK_ISSUER_URL: ${{ vars.CLERK_ISSUER_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
          MOBIUS_BASE_URL: ${{ vars.MOBIUS_BASE_URL }}
          SLACK_MOBIUS_AUTH_TOKEN: ${{ secrets.SLACK_MOBIUS_AUTH_TOKEN }}
          SLACK_OAUTH_STATE_SIGNING_KEY: ${{ secrets.SLACK_OAUTH_STATE_SIGNING_KEY }}
          SLACK_SERVER_BASE_URL: ${{ vars.SLACK_SERVER_BASE_URL }}
          SLACK_TOKEN_ENCRYPTION_KEY: ${{ secrets.SLACK_TOKEN_ENCRYPTION_KEY }}
        run: |
          node --input-type=module <<'JS'
          const environment = process.env.DEPLOY_ENVIRONMENT;
          if (!['staging', 'production'].includes(environment)) throw new Error('Invalid environment');
          const account = '95af7a3d67be8c49b1619544e3ce53c0';
          const worker = `mobius-cloud-${environment}`;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('Missing Cloudflare deployment token');
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/secrets`;
          const keys = ['APP_ORIGIN', 'AUTHENTICATION_BASE_URL', 'CLERK_ISSUER_URL', 'CLERK_PUBLISHABLE_KEY', 'CLERK_JWT_KEY', 'MOBIUS_BASE_URL', 'SLACK_MOBIUS_AUTH_TOKEN', 'SLACK_OAUTH_STATE_SIGNING_KEY', 'SLACK_SERVER_BASE_URL', 'SLACK_TOKEN_ENCRYPTION_KEY'];
          async function request(method, body) {
            const response = await fetch(endpoint, {
              method,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              signal: AbortSignal.timeout(30000),
              redirect: 'error',
            });
            if (!response.ok) throw new Error(`Cloudflare ${method} failed: HTTP ${response.status}`);
            const result = await response.json();
            if (result.success !== true) throw new Error(`Cloudflare ${method} failed`);
            return result.result;
          }
          const listed = await request('GET');
          if (!Array.isArray(listed) || !listed.every(item => typeof item.name === 'string')) {
            throw new Error('Invalid Worker secret inventory');
          }
          const existing = new Set(listed.map(item => item.name));
          const missing = keys.filter(name => !existing.has(name));
          for (const name of missing) {
            if (!process.env[name]) throw new Error(`Missing source setting: ${name}`);
          }
          for (const name of missing) {
            await request('PUT', { name, text: process.env[name], type: 'secret_text' });
            console.log(`Added ${name} to ${worker}`);
          }
          const verified = await request('GET');
          if (!Array.isArray(verified) || keys.some(name => !verified.some(item => item.name === name))) {
            throw new Error('Runtime settings verification failed');
          }
          console.log(`Verified ${keys.length} runtime setting names; existing values were preserved.`);
          JS
