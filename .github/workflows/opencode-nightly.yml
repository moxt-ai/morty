name: OpenCode nightly compatibility

on:
  schedule:
    # 02:00 Asia/Shanghai (18:00 UTC).
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-nightly-compatibility
  cancel-in-progress: false

jobs:
  live-opencode:
    name: local stack with latest OpenCode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mobius-read-token: ${{ secrets.MOBIUS_READ_TOKEN }}

      - name: Install latest OpenCode
        run: |
          npm install --global opencode-ai@latest
          opencode --version

      - name: Run OpenCode compatibility journey
        run: pnpm test:compatibility:opencode
        env:
          MOBIUS_E2E_ARTIFACT_ROOT: ${{ runner.temp }}/mobius-chat-opencode-e2e
          MOBIUS_E2E_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          MOBIUS_E2E_TIMEOUT_MS: "1200000"
          OPENCODE_DISABLE_AUTOUPDATE: "1"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/mobius-chat-opencode-e2e/**/artifacts
          if-no-files-found: warn
