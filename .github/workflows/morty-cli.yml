name: Morty CLI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Shared with explicit cloud recovery. Never cancel an active publication.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'morty-production-release' || format('morty-cli-{0}', github.ref) }}
  queue: max
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml

  package:
    needs: [security, validate, browser]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Reuse immutable artifacts when retrying this run
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-release.mjs
      - run: corepack enable
        if: steps.archive.outputs.restored != 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.archive.outputs.restored != 'true'
      - name: Assign the stable version after source acceptance
        if: steps.archive.outputs.restored != 'true'
        run: node scripts/prepare-release.mjs
      - run: pnpm build:cli
        if: steps.archive.outputs.restored != 'true'
      - name: Pack once and record source and integrity
        if: steps.archive.outputs.restored != 'true'
        run: node scripts/pack-release.mjs
      - name: Build and verify the matching cloud artifact
        if: steps.archive.outputs.restored != 'true'
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          MORTY_CLI_RELEASE_MANIFEST: .release/release.json
        run: |
          python3 deployment/build.py production
          mv .deployment-output/production .release/cloud
          python3 deployment/deploy.py production --release .release/cloud --verify-release-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.archive.outputs.restored != 'true'
        with:
          name: morty-release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test:client
      - run: pnpm test:relay
      - run: pnpm test:recording
      - run: pnpm test:runtime
      - run: pnpm test:worker
      - run: pnpm test:web

  browser:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cli
      - name: Install the accepted real Codex boundary dependency
        run: npm install --global @openai/codex@0.166.0
      - run: pnpm --filter @morty-build/e2e exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-${{ matrix.shard }}
          path: packages/e2e/test-results
          if-no-files-found: ignore

  installed:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0', '24.20.0', '22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-release
          path: .release
      - name: Install and verify the exact archive beside released Moxt
        run: node scripts/test-installed-release.mjs

  acceptance:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-release
          path: .release
      - name: Install the accepted real Claude boundary dependency
        run: npm install --global @anthropic-ai/claude-code@2.1.273
      - run: pnpm --filter @morty-build/e2e exec playwright install --with-deps chromium
      - name: Verify setup, pairing, image conversation and restart with the exact archive
        run: node scripts/test-release-journey.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-acceptance-${{ github.run_attempt }}
          path: |
            .release/acceptance/*-verification.json
            .release/acceptance/*.png
          include-hidden-files: true
          if-no-files-found: ignore

  publish:
    if: github.repository == 'moxt-ai/mobius-morty' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [security, package, validate, installed, browser, acceptance]
    runs-on: ubuntu-latest
    environment: morty-npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-release
          path: .release
      - name: Publish accepted bytes with OIDC and verify registry integrity
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: node scripts/publish-release.mjs

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: morty-production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-release
          path: .release
      - name: Verify authority and deploy the accepted release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MORTY_SERVICE_SECRET: ${{ secrets.MORTY_SERVICE_SECRET }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 deployment/verify-account-token.py
          python3 deployment/deploy.py production --release .release/cloud --cli-release .release/release.json
      - name: Preserve deployment verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-evidence-${{ github.run_attempt }}
          path: |
            deployment-evidence.json
            account-token-evidence.json
          if-no-files-found: ignore
          retention-days: 90

  github-release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-release
          path: .release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deployment-evidence-*
          path: .release/evidence
      - name: Finalize the deployed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/finalize-release.mjs
