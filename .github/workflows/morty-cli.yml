name: Morty CLI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Shared with explicit cloud recovery. Never cancel an active publication.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'morty-production-release' || format('morty-cli-{0}', github.ref) }}
  queue: max
  cancel-in-progress: false

jobs:
  pipeline:
    uses: ./.github/workflows/morty-pipeline.yml
    permissions:
      contents: read
      actions: read

  deployment-preflight:
    if: github.repository_id == '1446677406' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: pipeline
    runs-on: ubuntu-latest
    environment: morty-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-release
          path: .release
      - name: Verify production authority and secrets before publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MORTY_SERVICE_SECRET: ${{ secrets.MORTY_SERVICE_SECRET }}
          MORTY_SESSION_SIGNING_SECRET: ${{ secrets.MORTY_SESSION_SIGNING_SECRET }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 deployment/verify-account-token.py
          python3 deployment/deploy.py production --release .release/cloud --cli-release .release/release.json --preflight-only

  publish:
    if: github.repository_id == '1446677406' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [pipeline, deployment-preflight]
    runs-on: ubuntu-latest
    environment: morty-npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-release
          path: .release
      - name: Publish accepted bytes with OIDC and verify registry integrity
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: node scripts/publish-release.mjs

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: morty-production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-release
          path: .release
      - name: Verify authority and deploy the accepted release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MORTY_SERVICE_SECRET: ${{ secrets.MORTY_SERVICE_SECRET }}
          MORTY_SESSION_SIGNING_SECRET: ${{ secrets.MORTY_SESSION_SIGNING_SECRET }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 deployment/verify-account-token.py
          python3 deployment/deploy.py production --release .release/cloud --cli-release .release/release.json
      - name: Preserve deployment verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-evidence-${{ github.run_attempt }}
          path: |
            deployment-evidence.json
            account-token-evidence.json
            session-access-evidence.json
          if-no-files-found: ignore
          retention-days: 90

  github-release:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morty-release
          path: .release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deployment-evidence-*
          path: .release/evidence
      - name: Finalize the deployed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/finalize-release.mjs
