name: Security

on:
  workflow_call:
  schedule:
    - cron: '19 3 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan every commit for credentials
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner .
      - name: Fetch immutable security rules
        run: |
          git init "$RUNNER_TEMP/morty-security-rules"
          git -C "$RUNNER_TEMP/morty-security-rules" fetch --depth=1 https://github.com/semgrep/semgrep-rules.git 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          git -C "$RUNNER_TEMP/morty-security-rules" checkout --detach FETCH_HEAD
      - name: Scan code and workflows without network access
        # Semgrep CE 1.184.0; image and rules are immutable and run without cloud credentials.
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,size=1g --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env SEMGREP_SEND_METRICS=off \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$RUNNER_TEMP/morty-security-rules:/rules:ro" \
            --workdir /src --entrypoint python \
            semgrep/semgrep@sha256:83b9e9ee3df8ab1482dd7680cc78f25f6d9619a0caab7a687cf9eed31e88e4a1 \
            .github/security/scan.py /rules
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Audit locked dependencies
        run: pnpm audit --audit-level low
