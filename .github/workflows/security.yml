name: Security

on:
  workflow_call:
  schedule:
    - cron: '19 3 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned workflow analyzers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # zizmor 1.32.0 and actionlint 1.7.12, Linux x64 release assets.
          gh api repos/zizmorcore/zizmor/releases/assets/703541932 \
            --header 'Accept: application/octet-stream' > "$RUNNER_TEMP/zizmor.tar.gz"
          gh api repos/rhysd/actionlint/releases/assets/384924896 \
            --header 'Accept: application/octet-stream' > "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 'bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b' "$RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check --strict
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Check workflow syntax and shell scripts
        run: |
          # Require the hosted runner's ShellCheck instead of silently skipping it.
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -color
      - name: Check workflow security
        # Block medium/high findings; low-severity modernization is outside this security gate.
        # Offline analysis needs no API token or production credentials.
        run: |
          "$RUNNER_TEMP/zizmor" --offline --strict-collection --min-severity medium --format github .github/workflows
      - name: Scan every commit for credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          # The immutable Gitleaks 8.30.1 Linux x64 asset, with the same pinned checksum.
          gh api repos/gitleaks/gitleaks/releases/assets/378332058 \
            --header 'Accept: application/octet-stream' > "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner .
      - name: Fetch immutable security rules
        run: |
          git init "$RUNNER_TEMP/morty-security-rules"
          git -C "$RUNNER_TEMP/morty-security-rules" fetch --depth=1 https://github.com/semgrep/semgrep-rules.git 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          git -C "$RUNNER_TEMP/morty-security-rules" checkout --detach FETCH_HEAD
      - name: Scan code and workflows without network access
        # Semgrep CE 1.184.0; image and rules are immutable and run without cloud credentials.
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,size=1g --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env SEMGREP_SEND_METRICS=off \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$RUNNER_TEMP/morty-security-rules:/rules:ro" \
            --workdir /src --entrypoint python \
            semgrep/semgrep@sha256:83b9e9ee3df8ab1482dd7680cc78f25f6d9619a0caab7a687cf9eed31e88e4a1 \
            .github/security/scan.py /rules
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Audit locked dependencies
        run: pnpm audit --audit-level low
