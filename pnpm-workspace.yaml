engineStrict: true
minimumReleaseAge: 1440

overrides:
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'zod@>=4.0.0 <4.6.6': 4.6.7
  # The current Vite plugin pins an older Miniflare; retain its API and apply
  # patched leaf releases while its next version is inside the release-age gate.
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'sharp@>=0.35.0 <0.35.5': 0.35.5
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'seroval@>=1.0.0 <1.6.11': 1.6.11
  # Enforce security floors for Claude SDK/MCP transitive dependencies.
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'qs@>=6.7.0 <=6.16.0': 6.16.2
  '@agentclientprotocol/sdk': 1.4.0
  # Drizzle's archived loader only uses the transformer (GHSA-67mh-4wv8-2f99).
  '@esbuild-kit/core-utils@3.3.2>esbuild': 0.25.12
  # Math/Markdown plugins still request 0.16; keep their renderer and CSS on the
  # official security release until upstream ranges advance (GHSA-238p-pmpm-9mq7).
  'katex@<0.18.2': 0.18.2

catalog:
  '@biomejs/biome': 2.5.12
  '@cloudflare/vite-plugin': 1.65.0
  '@playwright/test': 1.64.1
