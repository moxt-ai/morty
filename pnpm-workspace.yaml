engineStrict: true
minimumReleaseAge: 1440

# dependency-cruiser's parser uses the TypeScript 6 JavaScript compiler API.
# Application compilation continues to use TypeScript 7.
packageExtensions:
  dependency-cruiser@18.2.0:
    dependencies:
      typescript: 6.0.3

packages:
  - packages/web
  - packages/worker
  - third-party/mobius/packages/protocol
  - third-party/mobius/packages/mobius-sdk
  - third-party/mobius/packages/cli
  - third-party/mobius/e2e/fixtures/fake-acp-agent
  - third-party/mobius/packages/relay-core
  - third-party/mobius/packages/relay-cloudflare-platform
  - third-party/mobius/packages/relay-cloudflare-standalone
  - third-party/mobius/tests

allowBuilds:
  '@sentry/cli': true
  bufferutil: false
  esbuild: true
  simple-git-hooks: true
  utf-8-validate: false
  workerd: true
