  '@vitest/coverage-istanbul': 4.1.12
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  dependency-cruiser: 18.2.0
  drizzle-kit: 0.31.8
  drizzle-orm: ^0.45.2
  esbuild: 0.28.2
  happy-dom: 21.0.4
  hono: ^4.13.14
  istanbul-lib-coverage: 3.2.2
  istanbul-lib-report: 3.0.1
  istanbul-reports: 3.2.0
  jsqr: ^1.4.0
  katex: 0.18.2
  knip: ^6.43.0
  lucide-react: 1.42.0
