engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@moxt-ai/mobius-sdk@0.0.14'

catalog:
  '@moxt-ai/mobius-protocol': 0.0.10
  '@moxt-ai/mobius-sdk': 0.0.14

# dependency-cruiser's parser uses the TypeScript 6 JavaScript compiler API.
# Application compilation continues to use TypeScript 7.
packageExtensions:
  dependency-cruiser@18.2.0:
    dependencies:
      typescript: 6.0.3

packages:
  - packages/e2e
  - packages/setup
  - packages/web
  - packages/worker

allowBuilds:
  '@sentry/cli': true
  bufferutil: false
  esbuild: true
  simple-git-hooks: true
  utf-8-validate: false
  workerd: true
